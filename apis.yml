name: Camp
description: >-
  CAMP is a family experience company operating immersive, rotating themed
  retail-and-play venues ("The Family Experience Store") across eleven U.S.
  markets — Atlanta, Boston, Charlotte, Chicago, Houston, Los Angeles, Miami,
  Minneapolis, New York City, Philadelphia, and Washington D.C. It blends
  hands-on crafts, counselor-led immersive activities, character meet-and-greets,
  birthday parties, and a curated toy retail store both in-store and through its
  online shop. CAMP is a venture-backed consumer brand (investors include Bullpen
  Capital) and is tracked in the API Evangelist network as a company profile; it
  does not currently publish a public developer platform, API, or SDK surface.
